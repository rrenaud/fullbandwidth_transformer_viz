<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closing the loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7; --ink:#1B1B1B; --muted:#6B6B6B; --line:#CFCFCA;
  --blue:#1F7FA6; --blue-soft:rgba(31,127,166,.16);
  --yellow:#B98A00; --yellow-soft:rgba(185,138,0,.22);
  --red:#D0402F;
  --grey-soft:rgba(0,0,0,.06); --bar:rgba(250,250,247,.92);
  --grad:#2F7D4F;
  /* Wire ramp: an ordered cool->magenta sweep indexed by SOURCE position, so the
     whole ribbon visibly slides one column right between passes. Nine smooth steps
     cannot clear the categorical adjacency thresholds and are not asked to - a
     wire's identity is carried by its x-position and by the z-label at the end it
     lands in; the ramp carries the ordering. Chroma floor and 3:1 contrast against
     both surfaces are validated. */
  --w1:#0071a0;
  --w2:#0070b1;
  --w3:#236ebe;
  --w4:#4e6bc6;
  --w5:#6d69c9;
  --w6:#8667c7;
  --w7:#9e65c0;
  --w8:#b265b6;
  --w9:#c465a8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --ink:#ECECEC; --muted:#9A9A9A; --line:#3A3A3A;
    --blue:#58C4DD; --blue-soft:rgba(88,196,221,.18);
    --yellow:#F7D96F; --yellow-soft:rgba(247,217,111,.26);
    --red:#FC6255;
    --grey-soft:rgba(255,255,255,.07); --bar:rgba(0,0,0,.88);
    --grad:#6FD39A;
    --w1:#00a2b9;
    --w2:#00a2ce;
    --w3:#3ba0de;
    --w4:#619eea;
    --w5:#819bf1;
    --w6:#9d98f2;
    --w7:#b695ef;
    --w8:#cd94e6;
    --w9:#e193da;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --ink:#ECECEC; --muted:#9A9A9A; --line:#3A3A3A;
  --blue:#58C4DD; --blue-soft:rgba(88,196,221,.18);
  --yellow:#F7D96F; --yellow-soft:rgba(247,217,111,.26);
  --red:#FC6255;
  --grey-soft:rgba(255,255,255,.07); --bar:rgba(0,0,0,.88);
  --grad:#6FD39A;
  --w1:#00a2b9;
  --w2:#00a2ce;
  --w3:#3ba0de;
  --w4:#619eea;
  --w5:#819bf1;
  --w6:#9d98f2;
  --w7:#b695ef;
  --w8:#cd94e6;
  --w9:#e193da;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"STIX Two Text","Times New Roman",Georgia,serif;font-size:16px;line-height:1.4}
main{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:0 28px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 20px 12px;margin-bottom:20px}
.topinner{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
h1{font-weight:400;font-size:20px;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 a{color:var(--muted);font-size:13px;font-weight:400;margin-left:10px;text-decoration:none;border-bottom:1px solid var(--line)}

.transport{display:flex;align-items:center;gap:8px}
.btn{font:inherit;font-size:15px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;min-width:40px}
.btn.primary{font-weight:600}
.btn[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.tickread{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:5.5em}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line);flex:none}
.oplus{font-size:14px;font-weight:400;line-height:1}
.sw.wire{width:22px;height:4px;border:0;border-radius:2px;
  background:linear-gradient(90deg,var(--w1),var(--w3),var(--w5),var(--w7),var(--w9))}

.layout{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(230px,.85fr);gap:30px;align-items:start}
@media (max-width:900px){ .layout{grid-template-columns:1fr} }
.stage svg{width:100%;height:auto;display:block}
.side{display:flex;flex-direction:column;gap:18px}
.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:0 0 6px}
.inset{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.inset text{font-family:inherit}
.formula{font-size:13.5px;margin:8px 0 0;text-align:center}
.hops{font-size:13px;line-height:1.4;color:var(--muted);margin:0;padding-top:16px;
  border-top:1px solid var(--line);text-align:center;min-height:4.2em}
.hops b{color:var(--ink);font-weight:600}


footer{max-width:1320px;margin:26px auto 0;padding:14px 20px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer a{color:inherit}

.flow{animation:flow .85s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){ .flow{animation:none} }
</style>
</head>
<body>

<div class="top">
  <div class="topinner">
    <h1>Closing the loop<a href="https://arxiv.org/abs/2608.08888" target="_blank" rel="noopener">arXiv:2608.08888</a></h1>
    <div class="transport">
      <button class="btn" id="back" aria-label="Step back">&lsaquo;</button>
      <button class="btn primary" id="play">Play</button>
      <button class="btn" id="fwd" aria-label="Step forward">&rsaquo;</button>
      <button class="btn" id="reset">Reset</button>
      <span class="tickread" id="tickread">0 / 18</span>
    </div>
    <div class="legend">
      <span><i class="sw wire"></i>latent, by source position</span>
      <span><i class="sw" style="background:var(--yellow-soft);border-color:var(--yellow)"></i>firing now</span>
      <span><i class="sw" style="background:var(--blue-soft);border-color:var(--blue)"></i>matches inference</span>
      <span><i class="sw" style="background:var(--grey-soft)"></i>computed</span>
      <span><i class="sw" style="border-style:dashed"></i>pending</span>
      <span><b class="oplus">&otimes;</b>gated fusion</span>
      <span><i class="sw" style="background:var(--grad);border-color:var(--grad)"></i>gradient</span>
    </div>
  </div>
</div>

<main>
  <div class="layout">
    <section class="stage"><svg id="stage" role="img" aria-label="Training passes stacked bottom to top; each pass hands its top-layer latents up into the next pass's inputs, shifted one position"></svg></section>
    <aside class="side">
      <div>
        <h2>Inside one input cell</h2>
        <svg class="inset" viewBox="0 0 300 152" role="img"
             aria-label="The previous latent supplies the value and the token embedding supplies the gate; their product is the input state">
          <rect x="88" y="6" width="124" height="25" rx="3" fill="var(--blue-soft)" stroke="var(--blue)"/>
          <text x="150" y="23" text-anchor="middle" font-size="12" fill="var(--ink)"><tspan font-style="italic">e</tspan><tspan font-size="8.5" dy="3">t</tspan><tspan dy="-3"> &#8855; </tspan><tspan font-style="italic">h</tspan><tspan font-size="8.5" dy="3">t&#8722;1</tspan></text>
          <line x1="150" y1="57" x2="150" y2="35" stroke="var(--muted)" stroke-width="1.2"/>
          <path d="M146.6,36 L153.4,36 L150,30 Z" fill="var(--muted)"/>
          <circle cx="150" cy="66" r="8" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
          <path d="M147,63 L153,69 M153,63 L147,69" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M51,110 V95 M51,72 V66 H142" fill="none" stroke="var(--muted)" stroke-width="1.2"/>
          <rect x="14" y="72" width="74" height="23" rx="11.5" fill="none" stroke="var(--muted)" stroke-dasharray="3 2"/>
          <text x="51" y="88" text-anchor="middle" font-size="11" fill="var(--muted)">&#963;(<tspan font-style="italic">W</tspan><tspan font-size="8" dy="-3">G</tspan><tspan dy="3" font-style="italic">e</tspan><tspan font-size="8" dy="3">t</tspan><tspan dy="-3">)</tspan></text>
          <text x="119" y="60" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-style="italic">gate</text>
          <path d="M249,110 V95 M249,72 V66 H158" fill="none" stroke="var(--w4)" stroke-width="1.4"/>
          <rect x="212" y="72" width="74" height="23" rx="3" fill="none" stroke="var(--w4)"/>
          <text x="249" y="88" text-anchor="middle" font-size="11" fill="var(--w4)"><tspan font-style="italic">W</tspan><tspan font-size="8" dy="-3">U</tspan><tspan dy="3" font-style="italic">h</tspan><tspan font-size="8" dy="3">t&#8722;1</tspan></text>
          <text x="181" y="60" text-anchor="middle" font-size="9.5" fill="var(--w4)" font-style="italic">value</text>
          <rect x="8" y="110" width="86" height="25" rx="3" fill="none" stroke="var(--line)"/>
          <text x="51" y="127" text-anchor="middle" font-size="12" fill="var(--ink)" font-style="italic">e<tspan font-size="8.5" dy="3">t</tspan></text>
          <text x="51" y="149" text-anchor="middle" font-size="10" fill="var(--muted)">token embedding</text>
          <rect x="206" y="110" width="86" height="25" rx="3" fill="none" stroke="var(--w4)"/>
          <text x="249" y="127" text-anchor="middle" font-size="12" fill="var(--w4)" font-style="italic">h<tspan font-size="8.5" dy="3">t&#8722;1</tspan></text>
          <text x="249" y="149" text-anchor="middle" font-size="10" fill="var(--muted)">from the pass below</text>
        </svg>
        <p class="formula"><i>e<sub>t</sub></i> &otimes; <i>h</i><sub><i>t</i>&minus;1</sub> = <i>W</i><sup>U</sup><i>h</i><sub><i>t</i>&minus;1</sub> &odot; &sigma;(<i>W</i><sup>G</sup><i>e<sub>t</sub></i>)</p>
      </div>
      <div><p class="hops" id="hops"></p></div>
    </aside>
  </div>
</main>

<footer>Illustrative &mdash; 10 tokens, 5 layers, three passes. <a href="https://arxiv.org/abs/2608.08888" target="_blank" rel="noopener">Full-Bandwidth Transformer, arXiv:2608.08888</a>.</footer>

<script>
const T=10, L=5, PASSES=3;
// The paper's schedule: "75% single-pass, 22% two-pass, 3% three-pass batches",
// introduced midway through training. They partition the batches, so they sum to 100
// and the figure is drawing the 3% case.
const batchShare={1:'75%',2:'22%',3:'3%'};
const targets=["cat","sat","on","the","warm","mat","by","the","door","."];
const words=["The","cat","sat","on","the","warm","mat","by","the","door"];
const NS="http://www.w3.org/2000/svg";

// Geometry. Passes stack downward; within a pass, depth runs upward (layer 0 =
// inputs at the bottom, layer L = latents at the top), matching viz 01. That puts
// a pass's output row as far as possible from the next pass's input row, which is
// the point: the return wire has to travel around the outside of the whole block.
const CW=27, CH=18, COLW=34, ROWH=21, PADL=96, TOP0=76, GAP=58;
const TARGY=48;                      // baseline of the target-token row at the head
const BLOCKH=L*ROWH+CH;
const PITCH=BLOCKH+GAP;
const X=t=>PADL+(t-1)*COLW+(COLW-CW)/2;
// Pass 1 sits at the BOTTOM and the iteration climbs. Depth still runs upward
// inside a pass, so a pass's latent row (the top of its block) ends up directly
// beneath the next pass's input row (the bottom of the block above it): the handoff
// is one short step up and one column right, with nothing to route around.
const blockTop=p=>TOP0+(PASSES-p)*PITCH;
const Y=(p,l)=>blockTop(p)+(L-l)*ROWH;
const GRIDR=X(T)+CW;
const VB_W=GRIDR+26;

const SUB=L+1;                       // sub-step 0 = inject inputs + latents, 1..L = layer sweep
let step=0, playing=false, timer=null, hover=null;
const FSTEPS=PASSES*SUB;             // forward: pass 1 upward, then pass 2, then pass 3
const TOTAL=FSTEPS*2;                // backward: the same rows again, top to bottom
// Because no latent is detached, the backward pass is one graph over the whole figure:
// it starts at pass 3's loss, walks down that block, crosses the handoff into pass 2's
// latent row, and keeps going. Row (p,l) is reached at this many backward sub-steps in.
const bIndex=(p,l)=>(PASSES-p)*SUB+(L-l)+1;
const gradAt=(p,l,s)=>s-FSTEPS>=bIndex(p,l);
const backRow=s=>{const i=s-FSTEPS-1; return i<0?null:{p:PASSES-Math.floor(i/SUB),l:L-i%SUB};};
const VB_H=Y(1,0)+CH+54;
const cellDone=(p,l,s)=>(p-1)*SUB+l<s;

// A state matches what sequential decoding would compute exactly when the chain of
// latent hops it needs fits in the passes available: position t needs t-1 hops, a
// k-pass run supplies k-1. Hence t <= p, and hence the staircase.
const exact=(p,t)=>t<=p;
// Where a state's latents actually came from: (p,t) was fed h from (p-1,t-1), which
// was fed from (p-2,t-2). The walk ends at pass 1 (no latent at all) or position 1
// (never has one) - and ending on pass 1 above position 1 is the truncation.
function chain(p,t){
  const c=[]; let cp=p, ct=t;
  while(cp>1&&ct>1){ c.push(`${cp}:${ct}`); cp--; ct--; }
  c.push(`${cp}:${ct}`);
  return {set:new Set(c), hops:Math.min(p-1,t-1), want:t-1, tail:{p:cp,t:ct}};
}

function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,s,attrs){const e=el('text',attrs,parent);e.textContent=s;return e}
const wire=t=>`var(--w${t})`;
// Out of the top of latent cell t, up across the gap, into the bottom of input cell
// t+1 in the pass above. Every hop is the same curve translated one column right, so
// the whole ribbon reads as a single shear and no two strands cross.
function curve(p,t){
  const x1=X(t)+CW-7, y1=Y(p,L), x2=X(t+1)+CW/2, y2=Y(p+1,0)+CH, k=(y1-y2)*.45;
  return `M${x1},${y1} C${x1},${y1-k} ${x2},${y2+k} ${x2},${y2}`;
}

const svg=document.getElementById('stage');
const tickread=document.getElementById('tickread');
const playBtn=document.getElementById('play');
const hops=document.getElementById('hops');

// Everything drawn is rebuilt every frame, so the interactive targets cannot live
// there: a mouse move would destroy the node it is over mid-gesture. They get their
// own layer instead, built once and only ever re-raised above the redrawn art.
let gHit=null;
function bind(node,h){
  const set=()=>{
    if(playing) return;
    if(hover&&hover.kind===h.kind&&hover.p===h.p&&hover.t===h.t&&hover.l===h.l) return;
    hover=h; render();
  };
  const clear=()=>{ if(!playing&&hover){ hover=null; render(); } };
  node.addEventListener('mouseenter',set); node.addEventListener('mouseleave',clear);
  node.addEventListener('focus',set);      node.addEventListener('blur',clear);
}
function buildHits(){
  gHit=el('g',{},svg);
  for(let p=1;p<PASSES;p++)for(let t=1;t<T;t++)
    bind(el('path',{d:curve(p,t),fill:'none',stroke:'transparent','stroke-width':9,
      style:'cursor:pointer','pointer-events':'stroke'},gHit),{kind:'latent',p,t});
  for(let p=1;p<=PASSES;p++)for(let t=1;t<=T;t++)for(let l=0;l<=L;l++)
    bind(el('rect',{x:X(t),y:Y(p,l),width:CW,height:CH,rx:3,fill:'transparent',
      'pointer-events':'all',style:'cursor:pointer',tabindex:l===L?0:-1},gHit),
      {kind:l===L?'latent':'cell',p,t,l});
}

function render(){
  const s=step;
  svg.setAttribute('viewBox',`0 0 ${VB_W} ${VB_H}`);
  for(let n=svg.firstChild;n;){ const nx=n.nextSibling; if(n!==gHit) svg.removeChild(n); n=nx; }
  const now=(s>0&&s<=FSTEPS)?{p:Math.floor((s-1)/SUB)+1,l:(s-1)%SUB}:null;
  const back=backRow(s);
  const ch=hover?chain(hover.p,hover.t):null;

  // Hovering a latent draws the two columns it ties together, one position apart.
  if(hover&&hover.kind==='latent'&&hover.p<PASSES){
    for(const [t,p] of [[hover.t,hover.p],[hover.t+1,hover.p+1]]){
      el('line',{x1:X(t)+CW/2,y1:blockTop(p)-2,x2:X(t)+CW/2,y2:Y(p,0)+CH+2,
        stroke:wire(hover.t),'stroke-width':1.2,'stroke-opacity':.55,'stroke-dasharray':'2 3'},svg);
    }
  }

  // The figure reads bottom to top now, so the sequence enters at the foot and the
  // predictions leave at the head.
  const wordY=Y(1,0)+CH+42;
  for(let t=1;t<=T;t++) txt(svg,words[t-1],{x:X(t)+CW/2,y:wordY,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});
  txt(svg,'tokens in',{x:PADL-12,y:wordY,'text-anchor':'end','font-size':9.5,fill:'var(--muted)','font-style':'italic'});

  for(let p=1;p<PASSES;p++) drawBus(p,s,ch);
  drawZeroTaps(s);
  for(let p=1;p<=PASSES;p++) drawBlock(p,s,now,back,ch);
  drawLoss(s);

  if(!gHit) buildHits(); else svg.appendChild(gHit);   // keep the targets on top
  hops.innerHTML=hopText();
  tickread.textContent=s>FSTEPS?`${s} / ${TOTAL} · back`:`${s} / ${TOTAL}`;
  playBtn.textContent=playing?'Pause':'Play';
}

// The return wire: out of the top of the latent row, up over the block, down the
// right channel past the whole next pass, then back leftward underneath it and up
// into the input cells - one position to the right of where each latent came from.
function drawBus(p,s,ch){
  if(!cellDone(p,L,s)) return;
  const delivered=s>p*SUB, live=s===p*SUB+1;
  for(let t=1;t<T;t++){
    const d=curve(p,t);
    // A hop is on the hovered state's chain when both of its ends are.
    const onChain=ch&&ch.set.has(`${p}:${t}`)&&ch.set.has(`${p+1}:${t+1}`);
    const lit=onChain||(hover&&hover.kind==='latent'&&hover.p===p&&hover.t===t);
    const c=wire(t);
    if(lit) el('path',{d,fill:'none',stroke:c,'stroke-width':11,'stroke-opacity':.22,'stroke-linecap':'round'},svg);
    const strand=el('path',{d,fill:'none',stroke:c,'stroke-width':lit?2.6:1.3,
      'stroke-opacity':lit?1:(live?.9:(delivered?.62:.3)),'stroke-linecap':'round'},svg);
    if(!delivered&&!live) strand.setAttribute('stroke-dasharray','3 4');
    if(live){ strand.setAttribute('stroke-dasharray','8 8'); strand.setAttribute('class','flow'); }
    if(delivered||live){
      // The latent does not replace the input, it is gated by it - so the wire ends on
      // the paper's (x) node just below the cell rather than a bare arrowhead.
      const x=X(t+1)+CW/2, y=Y(p+1,0)+CH+4.4;   // e_t (x) h_{t-1}: a product, not a sum
      el('circle',{cx:x,cy:y,r:4.2,fill:'var(--bg)',stroke:c,'stroke-width':lit?1.8:1.3},svg);
      el('path',{d:`M${x-1.9},${y-1.9} L${x+1.9},${y+1.9} M${x+1.9},${y-1.9} L${x-1.9},${y+1.9}`,
        stroke:c,'stroke-width':1.2,'stroke-linecap':'round'},svg);
    }
    // Gradient reaching the pass above crosses this same wire on the way down.
    if(gradAt(p+1,0,s)){
      el('path',{d,fill:'none',stroke:'var(--grad)','stroke-width':1.6,'stroke-opacity':.9,
        'stroke-dasharray':'5 3'},svg);
      const gx=X(t)+CW-7, gy=Y(p,L);
      el('path',{d:`M${gx-3.4},${gy-7} L${gx+3.4},${gy-7} L${gx},${gy-.5} Z`,fill:'var(--grad)'},svg);
    }
  }
  if(p===1){
    txt(svg,'one position right →',{x:X(1)+CW/2-8,y:(Y(p,L)+Y(p+1,0)+CH)/2+3,'text-anchor':'end','font-size':9,fill:'var(--muted)','font-style':'italic'});
  }
  // While the handoff is on screen, ring the row being handed back as well as the
  // row receiving it, so the two ends of the wire read as one event.
  if(live){
    el('rect',{x:X(1)-5,y:Y(p,L)-4,width:GRIDR-X(1)+10,height:CH+8,rx:4,fill:'none',
      stroke:'var(--blue)','stroke-width':1.2,'stroke-dasharray':'4 3','stroke-opacity':.85},svg);
  }
}

// Pass 1 has nothing to feed on: its latent inputs are zeros, drawn as stubs so the
// missing loop is visible rather than merely absent.
function drawZeroTaps(s){
  if(!cellDone(1,0,s)) return;
  // Pass 1 is the paper's plain single-pass term: the inputs are the bare embeddings
  // e_1:t, with no latent and so no gate at all - not a zero fed through one, which
  // the product form would collapse to zero anyway.
  const y1=Y(1,0)+CH+14;
  for(let t=2;t<=T;t++){
    const x=X(t)+CW/2;
    el('line',{x1:x,y1:Y(1,0)+CH+3,x2:x,y2:y1,stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'2 3'},svg);
  }
  txt(svg,'pass 1: plain embeddings, nothing to gate with',
    {x:(X(1)+GRIDR)/2,y:y1+11,'text-anchor':'middle','font-size':10,fill:'var(--muted)','font-style':'italic'});
}

// Every pass's top row is unembedded and scored against the same targets, so every
// latent row carries a tick out of the top - a pass hands its latents up AND takes a
// loss. Only the head of the figure has room to spell out the targets those ticks are
// scored against; the L-tags say the other passes are scored against the same ones.
function drawLoss(s){
  for(let p=1;p<=PASSES;p++){
    if(!cellDone(p,L,s)) continue;
    const top=blockTop(p), head=p===PASSES;
    const tip=head?TARGY+11:top-17, base=tip+7;
    for(let t=1;t<=T;t++){
      const x=X(t)+CW/2;
      el('line',{x1:x,y1:top-4,x2:x,y2:base,stroke:'var(--muted)','stroke-width':1,'stroke-opacity':.7},svg);
      el('path',{d:`M${x-3.2},${base} L${x+3.2},${base} L${x},${tip} Z`,fill:'var(--muted)'},svg);
    }
    const tag=el('text',{x:GRIDR+7,y:top+CH/2+3,'font-size':11.5,fill:gradAt(p,L,s)?'var(--grad)':'var(--muted)','font-style':'italic'},svg);
    tag.textContent='L';
    const sub=el('tspan',{dy:3,'font-size':8},tag); sub.textContent=String(p);
  }
  if(!cellDone(PASSES,L,s)) return;
  for(let t=1;t<=T;t++) txt(svg,targets[t-1],{x:X(t)+CW/2,y:TARGY,'text-anchor':'middle','font-size':10.5,fill:'var(--ink)'});
  txt(svg,'targets',{x:PADL-12,y:TARGY,'text-anchor':'end','font-size':9.5,fill:'var(--muted)','font-style':'italic'});
  el('path',{d:`M${X(1)},${TARGY-16} v-4 H${GRIDR} v4`,fill:'none',stroke:'var(--line)','stroke-width':1},svg);
  txt(svg,'training loss = L\u2081 + \u03BB(L\u2082 + L\u2083)/2',
    {x:(X(1)+GRIDR)/2,y:TARGY-26,'text-anchor':'middle','font-size':11.5,fill:'var(--ink)','font-style':'italic'},svg);
}

function drawBlock(p,s,now,back,ch){
  txt(svg,`PASS ${p}`,{x:4,y:blockTop(p)+BLOCKH/2-4,'font-size':10.5,fill:'var(--muted)','letter-spacing':'.08em'});
  txt(svg,`${batchShare[p]} of batches`,{x:4,y:blockTop(p)+BLOCKH/2+10,'font-size':9.5,fill:'var(--ink)'});
  for(let l=0;l<=L;l++){
    txt(svg,l===0?'in':String(l),
      {x:PADL-12,y:Y(p,l)+CH/2+3.5,'text-anchor':'end','font-size':10,fill:'var(--muted)'});
  }
  // Rows the gradient has already come down through, so a paused figure still shows
  // how far it reached rather than only where it is.
  for(let l=L;l>=0;l--){
    if(!gradAt(p,l,s)) continue;
    const here=back&&back.p===p&&back.l===l;
    el('rect',{x:X(1)-(here?11:9.5),y:Y(p,l)-(here?2:0),width:here?5:2.5,height:CH+(here?4:0),rx:1.4,
      fill:'var(--grad)','fill-opacity':here?1:.8},svg);
  }
  if(back&&back.p===p){
    el('rect',{x:X(1)-5,y:Y(p,back.l)-3,width:GRIDR-X(1)+10,height:CH+6,rx:4,fill:'none',
      stroke:'var(--grad)','stroke-width':1.4},svg);
  }
  const liveRow=now&&now.p===p?now.l:null;
  if(liveRow!==null&&cellDone(p,liveRow,s)){
    el('rect',{x:X(1)-5,y:Y(p,liveRow)-3,width:GRIDR-X(1)+10,height:CH+6,rx:4,
      fill:'var(--yellow-soft)','fill-opacity':.5,stroke:'var(--yellow)','stroke-width':1.2},svg);
    el('path',{d:`M${X(1)-13},${Y(p,liveRow)+CH/2-4} L${X(1)-8},${Y(p,liveRow)+CH/2} L${X(1)-13},${Y(p,liveRow)+CH/2+4} Z`,fill:'var(--yellow)'},svg);
  }
  // Position 1 never has a latent to wait for - that is the seed of the exact prefix.
  txt(svg,'∅',{x:X(1)+CW/2,y:Y(p,0)+CH+11,'text-anchor':'middle','font-size':9.5,fill:'var(--muted)'});

  for(let t=1;t<=T;t++)for(let l=0;l<=L;l++){
    const done=cellDone(p,l,s);
    let fill='none',stroke='var(--line)',sw=1,dash='3 2';
    if(done){
      dash='';
      if(exact(p,t)){ fill='var(--blue-soft)'; stroke='var(--blue)'; sw=.75; }
      else{ fill='var(--grey-soft)'; stroke='var(--line)'; }
    }
    const onChain=ch&&l===L&&ch.set.has(`${p}:${t}`);
    const lit=onChain||(hover&&hover.p===p&&hover.t===t&&(hover.kind==='latent'?l===L:hover.l===l));
    const dest=hover&&hover.kind==='latent'&&hover.p+1===p&&hover.t+1===t&&l===0;
    if(lit||dest){ stroke='var(--yellow)'; sw=2; }
    const g=el('g',{},svg);
    el('rect',{x:X(t),y:Y(p,l),width:CW,height:CH,rx:3,fill,stroke,'stroke-width':sw,'stroke-dasharray':dash},g);
    // The same colour marks both ends of one hop: a cap on the latent it leaves,
    // the arrowhead and z-label on the input it joins, one column to the right.
    if(done&&l===L&&t<T&&p<PASSES){
      el('rect',{x:X(t)+3,y:Y(p,L)-1.5,width:CW-6,height:3,rx:1.5,fill:wire(t)},g);
    }
    if(done&&l===0&&t>1&&p>1){
      txt(g,`h${t-1}`,{x:X(t)+CW/2,y:Y(p,0)+CH/2+2.8,'text-anchor':'middle','font-size':7.5,
        fill:wire(t-1),'font-weight':600,'pointer-events':'none'});
    }
  }
}


// Position t needs t-1 latent hops to match sequential decoding; a k-pass run can
// only supply k-1 of them, however long the sequence is. That shortfall is the whole
// difference between the training and inference recurrence.
function hopText(){
  if(!hover) return '<span>hover a cell to trace the latent hops that fed it</span>';
  const {p,t}=hover, c=chain(p,t);
  const hop=n=>`${n===1?'hop':'hops'}`;
  if(c.want===0) return `position 1 needs no latent at all &mdash; in training or at inference`;
  if(c.hops===c.want) return `position ${t} in pass ${p}: its full chain of <b>${c.want}</b> ${hop(c.want)} &mdash; what inference builds too`;
  return `position ${t} in pass ${p}: <b>${c.hops}</b> ${hop(c.hops)} of latent chain, inference builds <b>${c.want}</b>`;
}

function stop(){ playing=false; clearTimeout(timer); timer=null; render(); }
// The backward half retraces rows the forward half already explained, so it moves
// faster - and the handoff crossings are where it is worth pausing.
function dwell(s){
  if(s>FSTEPS) return (s-FSTEPS)%SUB===1?420:200;
  return (s-1)%SUB===0?900:300;
}
function play(){
  hover=null;
  if(step>=TOTAL) step=0;
  playing=true; render();
  const tickOnce=()=>{
    if(step>=TOTAL){ stop(); return; }
    step++; render();
    timer=setTimeout(tickOnce,dwell(step));
  };
  timer=setTimeout(tickOnce,260);
}
function move(d){ hover=null; step=Math.max(0,Math.min(TOTAL,step+d)); render(); }

document.getElementById('back').addEventListener('click',()=>{stop();move(-1)});
document.getElementById('fwd').addEventListener('click',()=>{stop();move(1)});
document.getElementById('reset').addEventListener('click',()=>{stop();step=0;hover=null;render()});
playBtn.addEventListener('click',()=>playing?stop():play());
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();playing?stop():play();}
  if(e.key==='ArrowRight'){stop();move(1);}
  if(e.key==='ArrowLeft'){stop();move(-1);}
});

render();
</script>
</body>
</html>
